<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Variador"><meta name="theme-color" content="#141414"><title>Variador · Banda</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#141414;--panel:#1b1b1b;--screen:#050505;--amber:#f2c14e;--cyan:#6fd0e0;--ink:#e8e8e8;--dim:#555;--on:#5cd65c;--warn:#e05a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px 16px;gap:12px}
.label{align-self:center;background:#f4f4ee;color:#111;padding:6px 18px;border-radius:4px;font-size:clamp(14px,4vw,20px)}
.display{background:var(--screen);border:2px solid #2a2a2a;border-radius:14px;padding:clamp(10px,3vh,26px) 16px;text-align:center;font-family:"Courier New",ui-monospace,monospace;font-weight:700}
.mpm{color:var(--amber);font-size:clamp(40px,13vw,84px);line-height:1.05;white-space:nowrap}
.mpm small{font-size:.55em}
.hz{color:var(--cyan);font-size:clamp(20px,6vw,38px);font-weight:400;margin-top:4px}
.dots{display:flex;justify-content:center;gap:22px;margin-top:12px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--dim);transition:background .15s,box-shadow .15s}
.dot.on{background:var(--on);box-shadow:0 0 10px var(--on)}
.dot.warn.on{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.dotlabels{display:flex;justify-content:center;gap:22px;font-size:11px;color:#888;margin-top:4px}
.dotlabels span{width:44px;text-align:center;margin:0 -14px}
.knobwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.knobbox{position:relative;height:100%;max-height:min(78vw,420px);aspect-ratio:1;touch-action:none}
.ticks{position:absolute;inset:0}
.knob{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a3a,#1c1c1c 70%);border:3px solid #444;box-shadow:0 8px 20px #000a, inset 0 2px 4px #fff2;touch-action:none;cursor:grab}
.knob .ind{position:absolute;left:50%;top:7%;width:7%;height:30%;margin-left:-3.5%;border-radius:8px;background:#fff;box-shadow:0 0 8px #fff6}
.edge{position:absolute;bottom:2%;font-size:clamp(13px,3.6vw,18px);color:#aaa}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{font:inherit;font-size:clamp(20px,6vw,30px);font-weight:700;color:var(--ink);background:#262626;border:2px solid #3a3a3a;border-radius:14px;padding:clamp(12px,2.4vh,22px) 0;touch-action:manipulation}
.btns button:active{background:#3a3a3a}
.btns .stop{color:#ff8a8a;font-size:clamp(15px,4.4vw,22px)}
.hint{text-align:center;font-size:12px;color:#888}
@media all{
.app{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;grid-template-areas:"d k" "b k";column-gap:20px;row-gap:10px;padding:10px calc(16px + env(safe-area-inset-right,0px)) 10px calc(16px + env(safe-area-inset-left,0px))}
.gd{grid-area:d;align-self:center}
.knobwrap{grid-area:k}
.gb{grid-area:b}
.mpm{font-size:clamp(34px,min(calc(var(--h,4px)*12),calc(var(--w,8px)*6.5)),68px)}
.hz{font-size:clamp(18px,min(calc(var(--h,4px)*6),calc(var(--w,8px)*3.4)),32px)}
.display{padding:12px}
.dots{margin-top:8px}
.btns button{padding:12px 0}
.knobwrap{min-width:0;min-height:0;overflow:hidden}
.knobbox{flex:none;max-height:none;max-width:none}
}
.force .app{position:fixed;top:0;left:0;transform-origin:0 0;padding-left:calc(16px + env(safe-area-inset-top,0px));padding-right:calc(16px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div class="app">
  <div class="gd">
    <div class="display">
      <div class="mpm"><span id="mpm">12.0</span> <small>m/min</small></div>
      <div class="hz"><span id="hz">42.0</span> Hz</div>
      <div class="dots">
        <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot warn" id="d3"></div>
      </div>
      <div class="dotlabels"><span>RUN</span><span>REF</span><span>ALTA</span></div>
    </div>
  </div>

  <div class="knobwrap">
    <div class="knobbox" id="box">
      <svg class="ticks" id="ticks" viewBox="0 0 200 200"></svg>
      <div class="knob" id="knob"><div class="ind"></div></div>
      <div class="edge" style="left:14%">0</div>
      <div class="edge" style="right:12%">60 Hz</div>
    </div>
  </div>

  <div class="gb">
    <div class="btns">
      <button id="minus">−</button>
      <button id="plus">+</button>
    </div>
    <div class="hint" style="margin-top:8px">Gira la perilla o usa − / + (0.5 Hz)</div>
  </div>
</div>

<script>
(function(){
  var MAX_HZ = 60, RATIO = 3.5;      // m/min = Hz / 3.5  (42 Hz -> 12 m/min)
  var hz = 42, ang = hz / MAX_HZ * 270 - 135;
  var knob = document.getElementById('knob'), box = document.getElementById('box');
  var $ = function(id){ return document.getElementById(id); };

  // marcas de la escala
  var s = '';
  for (var i = 0; i <= 12; i++){
    var a = (-135 + i * 22.5) * Math.PI / 180, big = i % 3 === 0;
    var r1 = big ? 86 : 90, r2 = 97;
    s += '<line x1="' + (100 + r1*Math.sin(a)) + '" y1="' + (100 - r1*Math.cos(a)) +
         '" x2="' + (100 + r2*Math.sin(a)) + '" y2="' + (100 - r2*Math.cos(a)) +
         '" stroke="' + (big ? '#bbb' : '#666') + '" stroke-width="' + (big ? 2.2 : 1.4) + '" stroke-linecap="round"/>';
  }
  $('ticks').innerHTML = s;

  function render(){
    ang = Math.max(-135, Math.min(135, ang));
    hz = Math.round((ang + 135) / 270 * MAX_HZ * 2) / 2;      // pasos de 0.5 Hz
    ang = hz / MAX_HZ * 270 - 135;
    knob.style.transform = 'rotate(' + ang + 'deg)';
    $('hz').textContent = hz.toFixed(1);
    $('mpm').textContent = (hz / RATIO).toFixed(1);
    $('d1').classList.toggle('on', hz > 0);
    $('d2').classList.toggle('on', hz > 0);
    $('d3').classList.toggle('on', hz >= 57);
    try{ localStorage.setItem('variador_hz', hz); }catch(e){}
  }

  function setHz(v){ ang = Math.max(0, Math.min(MAX_HZ, v)) / MAX_HZ * 270 - 135; render(); buzz(); }
  function buzz(){ try{ if (navigator.vibrate) navigator.vibrate(8); }catch(e){} }

  // Forzar formato horizontal: si el celular está en vertical, se gira la pantalla 90° por CSS
  var rot = 0, appEl = document.querySelector('.app');
  function orient(){
    var w = window.innerWidth, h = window.innerHeight, p = h > w;
    rot = p ? 90 : 0;
    var W = p ? h : w, H = p ? w : h;
    document.documentElement.classList.toggle('force', p);
    if (p){ appEl.style.width = W + 'px'; appEl.style.height = H + 'px'; appEl.style.transform = 'translateX(' + w + 'px) rotate(90deg)'; }
    else { appEl.style.width = ''; appEl.style.height = ''; appEl.style.transform = ''; }
    document.documentElement.style.setProperty('--w', (W / 100) + 'px');
    document.documentElement.style.setProperty('--h', (H / 100) + 'px');
    sizeKnob();
  }
  // La perilla siempre cuadrada (círculo perfecto): lado = el menor del espacio disponible
  function sizeKnob(){
    var p = box.parentNode;
    box.style.width = '0px'; box.style.height = '0px';
    var s = Math.floor(Math.min(p.clientWidth, p.clientHeight));
    s = Math.max(0, Math.min(s, 520));
    box.style.width = s + 'px'; box.style.height = s + 'px';
  }
  window.addEventListener('resize', orient);
  window.addEventListener('orientationchange', function(){ setTimeout(orient, 150); });
  try{ if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }catch(e){}
  orient();
  setTimeout(sizeKnob, 200);

  var dragging = false;
  function fromPointer(e){
    var r = box.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    var a = Math.atan2(dx, -dy) * 180 / Math.PI - rot; while (a > 180) a -= 360; while (a <= -180) a += 360;                // 0° = arriba, horario +
    if (Math.abs(a) > 135) a = ang < 0 ? -135 : 135;            // zona muerta: pegar al extremo
    ang = a; render();
  }
  box.addEventListener('pointerdown', function(e){ dragging = true; box.setPointerCapture(e.pointerId); fromPointer(e); e.preventDefault(); });
  box.addEventListener('pointermove', function(e){ if (dragging) fromPointer(e); });
  box.addEventListener('pointerup', function(){ dragging = false; });
  box.addEventListener('pointercancel', function(){ dragging = false; });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});

  // botones (mantener presionado = repetir)
  function hold(btn, delta){
    var t, iv;
    function step(){ setHz(hz + delta); }
    function start(e){ e.preventDefault(); step(); t = setTimeout(function(){ iv = setInterval(step, 70); }, 350); }
    function end(){ clearTimeout(t); clearInterval(iv); }
    btn.addEventListener('pointerdown', start);
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ btn.addEventListener(ev, end); });
  }
  hold($('minus'), -0.5); hold($('plus'), 0.5);

  try{ var saved = parseFloat(localStorage.getItem('variador_hz')); if (!isNaN(saved)) hz = saved; }catch(e){}
  ang = hz / MAX_HZ * 270 - 135; render();
})();
</script>
</body>
</html>
